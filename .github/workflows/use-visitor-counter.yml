name: Update repository views

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repository-views
  cancel-in-progress: false

jobs:
  update-visitor-count:
    runs-on: ubuntu-latest
    steps:
      - name: Check traffic token configuration
        id: configuration
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$TRAFFIC_TOKEN" ]]; then
            echo "::warning::TRAFFIC_TOKEN is missing; the last confirmed counter is unchanged. See README setup instructions."
            echo "## Counter not refreshed" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the TRAFFIC_TOKEN repository secret as described in README.md, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.configuration.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch and update repository views
        if: steps.configuration.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/traffic/views" |
            python3 .github/scripts/update_visitor_counter.py

      - name: Commit and push counter changes
        if: steps.configuration.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add README.md docs/ metrics.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update repository views counter" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main

      - name: Rebuild Pages with updated counter
        if: steps.configuration.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow run md-html-deploy.yml --repo "$REPOSITORY" --ref main
