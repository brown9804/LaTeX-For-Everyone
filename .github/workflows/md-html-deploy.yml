name: Validate and deploy learning platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Run focused automation tests
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Build MkDocs in strict mode
        run: python -m mkdocs build --strict

      - name: Check generated internal links and source coverage
        run: python .github/scripts/check_site.py

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            latexmk biber lmodern texlive-bibtex-extra texlive-latex-extra texlive-science \
            texlive-pictures texlive-fonts-recommended

      - name: Compile all examples, templates, and projects
        run: python .github/scripts/validate_examples.py

      - name: Upload compiled examples and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-examples
          path: |
            examples/**/build/*.pdf
            examples/**/build/*.log
            templates/**/build/*.pdf
            templates/**/build/*.log
            projects/**/build/*.pdf
            projects/**/build/*.log
          if-no-files-found: ignore

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
