name: Build and deploy documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test repository views updater
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc

      - name: Convert Markdown to HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp docs/styles.css _site/styles.css
          while IFS= read -r -d '' file; do
            relative="${file#docs/}"
            output="_site/${relative%.md}.html"
            mkdir -p "$(dirname "$output")"
            pandoc "$file" \
              --from=gfm+tex_math_dollars \
              --to=html5 \
              --standalone \
              --table-of-contents \
              --mathjax=https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js \
              --css=/LaTeX-For-Everyone/styles.css \
              --lua-filter=.github/scripts/markdown-links.lua \
              --output="$output"
          done < <(find docs -type f -name '*.md' -print0)
          test -s _site/index.html
          test -s _site/getting-started.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
